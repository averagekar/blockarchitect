name: CI & Build Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-client:
    name: Build & Validate Client
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: 'client/package-lock.json'

      - name: Install Client Dependencies
        run: |
          cd client
          npm ci --legacy-peer-deps

      - name: Build Vite Production Assets
        run: |
          cd client
          npm run build

  validate-server:
    name: Validate Server & Core Engine
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: 'server/package-lock.json'

      - name: Install Server Dependencies
        run: |
          cd server
          npm ci

      - name: Verify Server Module Syntax & Imports
        run: |
          cd server
          node -e "
            Promise.all([
              import('./src/ai.js'),
              import('./src/builder.js'),
              import('./src/schem.js'),
              import('./src/validate.js'),
              import('./src/prompt.js')
            ]).then(() => console.log('All backend modules passed validation.'));
          "
